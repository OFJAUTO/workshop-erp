# THE MONTHLY VIDEO ARCHIVE (9 November 2026): videos 12 months after the car left move to the
# Backblaze archive only (encrypted), from GitHub's cloud - never from the PC. The 2nd of each month, 06:30 Dubai.
name: Video archive (monthly)
on:
  schedule:
    - cron: "30 2 2 * *" # the 2nd, 02:30 UTC = 06:30 Dubai
  workflow_dispatch: {}
concurrency:
  group: offsite-video-archive
  cancel-in-progress: false
jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the one dependency
        working-directory: scripts/offsite
        run: npm init -y > /dev/null && npm install --no-audit --no-fund pg@8
      - name: Move videos older than the setting to the archive
        working-directory: scripts/offsite
        env:
          LIVE_DB_URL: ${{ secrets.LIVE_DB_URL }}
          LIVE_SUPABASE_URL: ${{ secrets.LIVE_SUPABASE_URL }}
          LIVE_SERVICE_ROLE_KEY: ${{ secrets.LIVE_SERVICE_ROLE_KEY }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: node archive-videos.mjs
